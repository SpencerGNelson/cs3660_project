{%extends "layout.html" %}
{% block main %}
    <h2>Services</h2>
    <div class="row">
        {% for category in categories %}
        <div class="card col">
            <div class="card-title">
                <h3>{{ category["name"] }}</h3>
            </div>
            <div class="card-body">
                <div class="list-group list-group-flush">
                    {% for service in category["services"] %}
                    <div class="list-item">{{ service }}</div>
                    {% endfor %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
