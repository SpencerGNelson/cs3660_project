{% extends "layout.html" %}
{% block main %}
    <h2>Add Category</h2>
    {% if not categories %}
        <p class="text-muted">No services found in the database.</p>
    {% else %}
        <div class="row g-4">
            {% for cat in categories %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="h5 mb-0">{{ cat.name }}</h3>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    {% endif %}
    <HR>
    Add Category
    <HR>
    <form action="add_category_submit" method="post" enctype="multipart/form-data">
        <div>
            Category<br>
            <input autocomplete="off" type="text" name="name" placeholder="Name">
        </div>
         <div>
            Upload a Photo<br>
            <input autocomplete="off" type="file" name="image_file" placeholder="Picture">
        </div>
         <div>
            <input type="submit">
        </div>
    </form>
{% endblock %}
