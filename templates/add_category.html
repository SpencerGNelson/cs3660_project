{% extends "layout.html" %}
{% block main %}
    <h2>Add Category</h2>
    {% if not categories %}
        <p class="text-muted">No services found in the database.</p>
    {% else %}
        <div class="row g-4" id="categoriesList">
            {% for cat in categories %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="h5 mb-0">{{ cat.name }}</h3>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    {% endif %}
    <HR>
    Add Category
    <HR>
    <div id="message"></div>
    <form id="categoryForm" enctype="multipart/form-data">
        <div>
            Category<br>
            <input autocomplete="off" type="text" name="name" placeholder="Name">
        </div>
         <div>
            Upload a Photo<br>
            <input autocomplete="off" type="file" name="image_file" placeholder="Picture">
        </div>
         <div>
            <input type="submit">
        </div>
    </form>
    
    <script>
    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const messageDiv = document.getElementById('message');
        
        try {
            const response = await fetch('/add_category_submit', {
                method: 'POST',
                body: formData
            });
            
            const text = await response.text();
            
            messageDiv.innerHTML = '';
            
            if (text === 'ok') {
                window.location.reload();
            } else if (text === 'err_missing') {
                alert('Please fill in all required fields and upload an image.');
            } else if (text === 'err_filetype') {
                alert('Invalid file type. Please upload a valid image (jpg, png, gif, webp).');
            } else if (text === 'err_filesave') {
                alert('Failed to save image file. Please try again.');
            } else if (text === 'err_db') {
                alert('Database error. Please try again.');
            } else {
                alert('An error occurred. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network error. Please try again.');
        }
    });
    </script>
{% endblock %}
