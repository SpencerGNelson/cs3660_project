{% extends "layout.html" %}
{% block main %}
    <h2>Add Service Provider</h2>
    <div class="row">
        {% for pro in professionals %}
        <div class="col-md-4 text-center mb-4">
            <img src="{{ url_for('static', filename='images/' + pro['image_filename']) }}"
                 style="width: 225px; height: 225px; object-fit: cover; border-radius: 50%;"
                 alt="{{ pro['name'] }}"
                 class="img-fluid mb-3">
            <h3>{{ pro['name'] }}</h3>
            {% if pro['title'] %}
                <p class="text-muted">{{ pro['title'] }}</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    <HR>    
        Add a New Service Provider Below
    <HR>
    <form action="add_professional_submit" method="post" enctype="multipart/form-data">
        <div>
            Provider Name<br>
            <input autocomplete="off" type="text" name="name" placeholder="Name">
        </div>
        <div>
            Provider Email<br>
            <input autocomplete="off" type="text" name="email" placeholder="Email">
        </div>
         <div>
            Upload a Photo<br>
            <input autocomplete="off" type="file" name="image_file" placeholder="Picture">
        </div>
         <div>
            <input type="submit">
        </div>
    </form>
{% endblock %}
